<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Frame -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Grid lines -->
  <path d="M48 88 h160 M48 128 h160 M48 168 h160" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
  <path d="M88 48 v160 M128 48 v160 M168 48 v160" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />

  <!-- Pulse / Heartbeat waveform with glowing shadow -->
  <path d="M40 128 L82 128 L98 84 L114 172 L132 108 L144 142 L156 128 L216 128"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Orbiting pulse nodes -->
  <circle cx="98" cy="84" r="5" fill="#38bdf8" />
  <circle cx="114" cy="172" r="5" fill="#4ade80" />
  <circle cx="132" cy="108" r="5" fill="#a855f7" />
</svg>
